<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Hippo Desk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/styles.css">
  <script type="module" src="./src/main.ts"></script>
</head>
<body>
  <main id="desk">
    <canvas id="stage" aria-label="The desk"></canvas>
    <header class="top">
      <div class="tally">
        <div id="tools" class="tools" role="toolbar" aria-label="Desk"></div>
        <p id="count" class="count" data-testid="count" aria-live="polite"></p>
        <p id="progress" class="progress" role="status"></p>
      </div>
      <div id="layouts" class="layouts" role="group" aria-label="Arrange by"></div>
    </header>
    <section id="settings" class="settings" role="dialog" aria-label="Settings" hidden></section>
    <footer id="bottom" class="bottom">
      <p id="reply" class="reply" data-testid="reply" aria-live="polite"></p>
      <div id="ask" class="ask" role="search"></div>
    </footer>
  </main>
</body>
</html>
